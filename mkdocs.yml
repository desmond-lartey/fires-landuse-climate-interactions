site_name: Fire, Land Use and Climate Interactions
site_description: Drivers of fire regimes in conservation landscapes of West Africa — a 20-year, 15-park buffer-based analysis
site_author: Desmond Lartey
repo_url: https://github.com/desmond-lartey/fires-landuse-climate-interactions

copyright: "Copyright &copy; 2026 Desmond Lartey"

theme:
    name: material
    favicon: assets/favicon.png
    icon:
        logo: material/fire
        repo: fontawesome/brands/github
    palette:
        - scheme: slate
          primary: deep orange
          accent: orange
          toggle:
              icon: material/toggle-switch
              name: Switch to light mode
        - scheme: default
          primary: deep orange
          accent: orange
          toggle:
              icon: material/toggle-switch-off-outline
              name: Switch to dark mode
    features:
        - navigation.instant
        - navigation.tracking
        - navigation.top
        - search.highlight
        - search.share
        - content.code.copy

plugins:
    - search

nav:
    - Home: index.md
    - Study Design: study-design.md
    - Pipeline: pipeline.md
    - Script Reference: script-reference.md
    - Data & Outputs: data-outputs.md
    - Findings: findings.md

markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight
    - tables
    - toc:
          permalink: true
